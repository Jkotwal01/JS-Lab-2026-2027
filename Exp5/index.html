<!DOCTYPE html>
<html>

<head>
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div
        class="style-class-1">
        <h3 class="style-class-2">Student Details</h3>
        <p class="style-class-3"><b>Name:</b> Jay Kotwal</p>
        <p class="style-class-3"><b>Roll No:</b> 42149</p>
        <p class="style-class-3"><b>Batch:</b> R5</p>
    </div>

    <h1>Countdown Timer</h1>

    <!-- Set date and time from frontend -->
    <label>Enter End Date:</label>
    <input type="date" id="endDate">

    <br><br>

    <label>Enter End Time:</label>
    <input type="time" id="endTime">

    <br><br>

    <button onclick="startCountdown()">Start Countdown</button>
    <button onclick="resetCountdown()" class="style-class-4">Reset</button>

    <h2 id="countdown">00 Days 00 Hours 00 Minutes 00 Seconds</h2>

    <script src="script.js"></script>

</body>

</html>
