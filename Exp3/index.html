<!DOCTYPE html>
<html>
<head>
    <title>String Manipulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>String Manipulator</h2>

    <label>Enter String:</label>
    <input type="text" id="mainString" placeholder="Enter a string">

    <h3>1. Reverse String</h3>
    <button onclick="reverseString()">Reverse</button>

    <h3>2. Replace Character</h3>
    <input type="text" id="fromChar" placeholder="Character to replace" maxlength="1">
    <input type="text" id="toChar" placeholder="New character" maxlength="1">
    <button onclick="replaceCharacter()">Replace</button>

    <h3>3. Check Palindrome</h3>
    <button onclick="checkPalindrome()">Check</button>

    <h3>Output:</h3>
    <p id="output">Result will appear here.</p>

    <button onclick="resetAll()">Reset</button>

    <script src="script.js"></script>
</body>

</html>
