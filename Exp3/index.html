<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Manipulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="style-class-1">

    <!-- Student Details -->
    <div class="style-class-2">
        <h3 class="style-class-3">Student Details</h3>
        <p class="style-class-4"><b>Name:</b> Jay Kotwal</p>
        <p class="style-class-4"><b>Roll No:</b> 42149</p>
        <p class="style-class-4"><b>Batch:</b> R5</p>
    </div>

    <!-- Main Container -->
    <div
        class="style-class-5">
        <h3
            class="style-class-6">
            String Manipulator</h3>

        <!-- Input Section -->
        <div class="style-class-7">
            <label for="mainString"
                class="input-label">Enter
                String:</label>
            <input type="text" id="mainString" placeholder="Type your text here..."
                class="input-field">
        </div>

        <!-- Action 1: Reverse -->
        <div
            class="style-class-10">
            <h5 class="style-class-11">1. Reverse String</h5>
            <button onclick="reverseString()"
                class="style-class-12">Reverse
                Now</button>
        </div>

        <!-- Action 2: Replace -->
        <div
            class="style-class-10">
            <h5 class="style-class-13">2. Replace Character</h5>
            <div class="style-class-14">
                <div class="style-class-15">
                    <label for="fromChar"
                        class="style-class-16">Replace this:</label>
                    <input type="text" id="fromChar" maxlength="1" placeholder="e.g., a"
                        class="style-class-17">
                </div>
                <div class="style-class-15">
                    <label for="toChar" class="style-class-16">With
                        this:</label>
                    <input type="text" id="toChar" maxlength="1" placeholder="e.g., x"
                        class="style-class-17">
                </div>
            </div>
            <button onclick="replaceCharacter()"
                class="style-class-18">Replace
                Now</button>
        </div>

        <!-- Action 3: Palindrome Checker -->
        <div
            class="style-class-19">
            <h5 class="style-class-20">3. Check Palindrome</h5>
            <button onclick="checkPalindrome()"
                class="style-class-21">Check
                Status</button>
        </div>

        <!-- Display Output Box -->
        <div
            class="style-class-22">
            <span
                class="style-class-23">Output:</span>
            <div id="outputDisplay" class="style-class-24">
                Result will appear here...</div>
        </div>

        <button onclick="resetAll()"
            class="style-class-25">
            Reset
        </button>
    </div>

    <!-- Link your external js file here -->
    <script src="script.js"></script>
</body>

</html>
