<!DOCTYPE html>
<html>

<head>
    <title>String Comparator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>String Comparator</h2>

    <label>String 1:</label>
    <input type="text" id="stringOne" placeholder="Enter first string">

    <br><br>

    <label>String 2:</label>
    <input type="text" id="stringTwo" placeholder="Enter second string">

    <br><br>
    
    <button onclick="compareWithStrictEquality()">Compare using ===</button>
    <br>
    <button onclick="compareWithLengthLoop()">Compare using Loop</button>
    <br>
    <button onclick="compareWithLocaleCompare()">Compare using localeCompare()</button>

    <h3>Output:</h3>
    <p id="outputDisplay">Result will appear here.</p>

    <button onclick="resetAll()">Reset</button>

    <script src="script.js"></script>
</body>

</html>
