<!DOCTYPE html>
<html>

<head>
    <title>Array Operations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Array Operations</h2>

    <label>Array Length:</label>
    <input type="number" id="arrayLength">
    <button onclick="generateArray()">Generate Array</button>

    <br><br>

    <label>Element to Delete:</label>
    <input type="number" id="deleteInput">

    <br><br>

    <label>Element to Search:</label>
    <input type="number" id="searchInput">

    <h3>Remove Element</h3>
    <button onclick="removeElementWithMethod()">Using Method</button>
    <button onclick="removeElementWithoutMethod()">Without Method</button>

    <h3>Search Element</h3>
    <button onclick="checkContainsWithMethod()">Using Method</button>
    <button onclick="checkContainsWithoutMethod()">Without Method</button>

    <h3>Empty Array</h3>
    <button onclick="emptyArray()">Empty Array</button>

    <h3>Output</h3>
    <p id="outputDisplay">Current Array: []<br><br>Result:</p>

    <button onclick="resetAll()">Reset All</button>

    <script src="script.js"></script>
</body>

</html>
