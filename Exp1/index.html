<!DOCTYPE html>
<html>

<head>
    <title>Area Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Student Details -->
        <div class="card" style="margin-bottom: 30px; max-width: 300px; margin-left: auto; margin-right: auto; padding: 10px;">
            <h3 style="margin-top: 10px;">Student Details</h3>
            <p style="margin: 5px 0;"><b>Name:</b> Jay Kotwal</p>
            <p style="margin: 5px 0;"><b>Roll No:</b> 42149</p>
            <p style="margin: 5px 0;"><b>Batch:</b> R5</p>
        </div>

        <h1>Area Calculator</h1>

        <div class="cards">
            <!-- Circle -->
            <div class="card">
                <h3>Circle</h3>
                <label><b>Radius:</b></label>
                <input type="number" id="radius">
                <button onclick="circleArea()">Find Area</button>
                <p id="circleResult" style="font-weight: bold; margin-top: 15px;"></p>
                <div style="margin-top: 30px; max-width: 200px; margin-left: auto; margin-right: auto;">
            <button onclick="resetAllC()" style="background: #f44336;">Reset All</button>
        </div>
            </div>

            <!-- Rectangle -->
            <div class="card">
                <h3>Rectangle</h3>
                <label><b>Length:</b></label>
                <input type="number" id="length">
                <label><b>Width:</b></label>
                <input type="number" id="width">
                <button onclick="rectangleArea()">Find Area</button>
                <p id="rectangleResult" style="font-weight: bold; margin-top: 15px;"></p>
                <div style="margin-top: 30px; max-width: 200px; margin-left: auto; margin-right: auto;">
            <button onclick="resetAllR()" style="background: #f44336;">Reset All</button>
        </div>
            </div>

            <!-- Triangle -->
            <div class="card">
                <h3>Triangle</h3>
                <label><b>Side A:</b></label>
                <input type="number" id="a">
                <label><b>Side B:</b></label>
                <input type="number" id="b">
                <label><b>Side C:</b></label>
                <input type="number" id="c">
                <button onclick="triangleArea()">Find Area</button>
                <p id="triangleResult" style="font-weight: bold; margin-top: 15px;"></p>
                <div style="margin-top: 30px; max-width: 200px; margin-left: auto; margin-right: auto;">
            <button onclick="resetAllT()" style="background: #f44336;">Reset All</button>
        </div>
            </div>
        </div>

        <!-- <div style="margin-top: 30px; max-width: 200px; margin-left: auto; margin-right: auto;">
            <button onclick="resetAll()" style="background: #f44336;">Reset All</button>
        </div> -->
    </div>

    <script src="script.js"></script>
</body>

</html>
