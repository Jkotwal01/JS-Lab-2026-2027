<!DOCTYPE html>
<html>

<head>
    <title>Area Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Area Calculator</h1>

    <div class="cards">

        <!-- Circle -->
        <div class="card">
            <h3>Circle</h3>
            <label>Radius:</label>
            <input type="number" id="radius">

            <button onclick="circleArea()">Find Area</button>
            <button onclick="resetCircle()">Reset</button>

            <p id="circleResult"></p>
        </div>

        <!-- Rectangle -->
        <div class="card">
            <h3>Rectangle</h3>
            <label>Length:</label>
            <input type="number" id="length">

            <label>Width:</label>
            <input type="number" id="width">

            <button onclick="rectangleArea()">Find Area</button>
            <button onclick="resetRectangle()">Reset</button>

            <p id="rectangleResult"></p>
        </div>

        <!-- Triangle -->
        <div class="card">
            <h3>Triangle</h3>
            <label>Side A:</label>
            <input type="number" id="a">

            <label>Side B:</label>
            <input type="number" id="b">

            <label>Side C:</label>
            <input type="number" id="c">

            <button onclick="triangleArea()">Find Area</button>
            <button onclick="resetTriangle()">Reset</button>

            <p id="triangleResult"></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
